name: Build OpenRGB Windows
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-qt6-base mingw-w64-ucrt-x86_64-qt6-tools mingw-w64-ucrt-x86_64-hidapi mingw-w64-ucrt-x86_64-libusb mingw-w64-ucrt-x86_64-mbedtls make git

      - name: Compile
        shell: msys2 {0}
        run: |
          sed -i 's/_MSC_VER/_WIN32/g' dependencies/hueplusplus-1.2.0/src/TimePattern.cpp
          printf 'int superio_inb(int a,int b){return 0;} void superio_outb(int a,int b,int c){} void superio_enter(int a){} void superio_exit(int a){}\n' > superio_stub.cpp
          printf '\nSOURCES += superio_stub.cpp\n' >> OpenRGB.pro
          /ucrt64/bin/qmake6 OpenRGB.pro "LIBS += -lhidapi -lusb-1.0 -lws2_32 -liphlpapi -lsetupapi -lole32 -loleaut32 -luuid -lwbemuuid -lmbedtls -lmbedx509 -lmbedcrypto"
          sed -i 's|-include release/precompiled_header.h||g; s|release/precompiled_header.h.gch/c++||g; s|release/precompiled_header.h.gch/c||g; s|/utf-8||g; s|-DHID_HOTPLUG_ENABLED=1||g' Makefile.Release
          make -j4
          mkdir -p OpenRGB_Win64
          cp release/OpenRGB.exe OpenRGB_Win64/ || cp OpenRGB.exe OpenRGB_Win64/
          /ucrt64/bin/windeployqt6 OpenRGB_Win64/OpenRGB.exe
          ldd OpenRGB_Win64/OpenRGB.exe | grep '/ucrt64/bin/' | awk '{print $3}' | xargs -I {} cp -n {} OpenRGB_Win64/
          cp /ucrt64/bin/libgcc_s_seh-1.dll /ucrt64/bin/libwinpthread-1.dll /ucrt64/bin/libstdc++-6.dll /ucrt64/bin/libhidapi-0.dll /ucrt64/bin/libusb-1.0.dll OpenRGB_Win64/
          cp /ucrt64/bin/libmbed*.dll OpenRGB_Win64/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: OpenRGB_Win64
          path: OpenRGB_Win64

