name: Build OpenRGB Windows
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-qt6-base make
      - name: Compile
        shell: msys2 {0}
        run: |
          /ucrt64/bin/qmake6 OpenRGB.pro
          make -j4
          mkdir -p OpenRGB_Win64
          cp release/OpenRGB.exe OpenRGB_Win64/ || cp OpenRGB.exe OpenRGB_Win64/
          /ucrt64/bin/windeployqt6 OpenRGB_Win64/OpenRGB.exe
          cp /ucrt64/bin/libstdc++-6.dll /ucrt64/bin/libgcc_s_seh-1.dll /ucrt64/bin/libwinpthread-1.dll OpenRGB_Win64/
      - uses: actions/upload-artifact@v4
        with:
          name: OpenRGB_Win64
          path: OpenRGB_Win64
